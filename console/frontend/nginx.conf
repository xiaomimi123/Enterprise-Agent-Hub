server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 用 Docker 内置 DNS 动态解析后端地址：后端容器重建后 IP 会变，避免 nginx 一直连旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 请求体上限：nginx 默认只有 1MB，带参考图出图（每张最多 10MB、最多 4 张）、图生视频上传、知识库 / 技能文件上传都会被挡成 413。
    # 单个文件的大小由后端按各自的规则再限制，这里只是不让 nginx 先拒绝
    client_max_body_size 50m;

    # 接口转发给控制台后端（同源，登录 cookie 才能生效）
    location /api/ {
        set $console_api http://console-api:8100;
        proxy_pass $console_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：其他路径都回到 index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
