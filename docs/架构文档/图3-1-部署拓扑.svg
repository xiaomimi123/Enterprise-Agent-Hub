<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9CA3AF"/></marker>
    <style>
      .zone{fill:#F3F4F6;stroke:#D1D5DB;stroke-width:1.2}
      .box{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2}
      .hot{fill:#EEF2FF;stroke:#4F46E5;stroke-width:1.8}
      .t1{font-size:15px;font-weight:700;fill:#111827}
      .t2{font-size:12px;fill:#4B5563}
      .zt{font-size:14px;font-weight:700;fill:#374151}
      .ln{stroke:#9CA3AF;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lb{font-size:11px;fill:#6B7280}
    </style>
  </defs>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#111827">员工的 agent 只连中枢：身份、权限、知识、算力、模型和审计都在中枢</text>

  <!-- 员工电脑 -->
  <rect class="zone" x="20" y="60" width="232" height="560" rx="14"/>
  <text class="zt" x="38" y="88">员工电脑</text>
  <rect class="box" x="36" y="104" width="200" height="104" rx="10"/>
  <text class="t1" x="52" y="132">桌面 agent</text>
  <text class="t2" x="52" y="154">WorkBuddy · Cursor · Claude</text>
  <text class="t2" x="52" y="174">CodeBuddy CLI · Hermes</text>
  <text class="t2" x="52" y="194">经本地 MCP 桥（stdio）接入</text>
  <rect class="box" x="36" y="228" width="200" height="104" rx="10"/>
  <text class="t1" x="52" y="256">接入器 hub_agent.py</text>
  <text class="t2" x="52" y="278">登录 · 同步技能与模型 · 心跳</text>
  <text class="t2" x="52" y="298">应用下载启动 · 依赖预检</text>
  <text class="t2" x="52" y="318">成果 outbox 转发</text>
  <rect class="box" x="36" y="352" width="200" height="124" rx="10"/>
  <text class="t1" x="52" y="380">小红书运营工作台</text>
  <text class="t2" x="52" y="402">中枢分发的本机应用</text>
  <text class="t2" x="52" y="422">自带手册 + 读中枢技能</text>
  <text class="t2" x="52" y="442">产出写入 outbox</text>
  <text class="t2" x="52" y="462">底层 agent 经嵌套桥连中枢</text>
  <rect class="box" x="36" y="496" width="200" height="104" rx="10"/>
  <text class="t1" x="52" y="524">浏览器</text>
  <text class="t2" x="52" y="546">管理员 / 老板 / 主管用控制台</text>
  <text class="t2" x="52" y="566">员工首次登录（PKCE）</text>

  <!-- 中枢服务器 -->
  <rect class="zone" x="300" y="60" width="440" height="560" rx="14"/>
  <text class="zt" x="318" y="88">中枢服务器 · Docker</text>
  <rect class="hot" x="318" y="104" width="190" height="86" rx="10"/>
  <text class="t1" x="334" y="132">hub-mcp :8200</text>
  <text class="t2" x="334" y="154">鉴权 · 岗位包 · 审计</text>
  <text class="t2" x="334" y="174">技能 / 知识 / 建议 / 成果工具</text>
  <rect class="box" x="532" y="104" width="190" height="86" rx="10"/>
  <text class="t1" x="548" y="132">hub-worker</text>
  <text class="t2" x="548" y="154">GPU 调度 · 掉线改派</text>
  <text class="t2" x="548" y="174">收取结果</text>
  <rect class="hot" x="318" y="214" width="404" height="86" rx="10"/>
  <text class="t1" x="334" y="242">console-web :8088 / console-api</text>
  <text class="t2" x="334" y="264">控制台（按角色限制）· 员工端接入接口 · 生成接口</text>
  <text class="t2" x="334" y="284">技能库 / 知识库编辑与审核 · 改进建议 · 工作看板 · 应用分发</text>
  <rect class="box" x="318" y="324" width="190" height="78" rx="10"/>
  <text class="t1" x="334" y="352">RAGFlow</text>
  <text class="t2" x="334" y="374">混合检索 · 嵌入模型</text>
  <rect class="box" x="532" y="324" width="190" height="78" rx="10"/>
  <text class="t1" x="548" y="352">New API :3000</text>
  <text class="t2" x="548" y="374">模型网关 · 按人计量</text>
  <rect class="box" x="318" y="426" width="190" height="78" rx="10"/>
  <text class="t1" x="334" y="454">Casdoor :8000</text>
  <text class="t2" x="334" y="476">身份 · 组织 · 部门</text>
  <rect class="box" x="532" y="426" width="190" height="78" rx="10"/>
  <text class="t1" x="548" y="454">Redis</text>
  <text class="t2" x="548" y="476">缓存</text>
  <rect class="box" x="318" y="528" width="404" height="76" rx="10"/>
  <text class="t1" x="334" y="556">PostgreSQL（hub 库）</text>
  <text class="t2" x="334" y="578">岗位包 · 角色 · 技能与知识库版本 · 建议 · 成果 · 审计 · GPU 队列</text>

  <!-- 外部 -->
  <rect class="zone" x="788" y="60" width="152" height="268" rx="14"/>
  <text class="zt" x="802" y="88">算力</text>
  <rect class="box" x="800" y="104" width="128" height="68" rx="10"/>
  <text class="t1" x="812" y="130">ComfyUI</text>
  <text class="t2" x="812" y="150">本机 GPU</text>
  <rect class="box" x="800" y="184" width="128" height="62" rx="10"/>
  <text class="t1" x="812" y="210">H3 网关</text>
  <text class="t2" x="812" y="230">视频 REST</text>
  <rect class="box" x="800" y="258" width="128" height="56" rx="10"/>
  <text class="t1" x="812" y="282">第三方出图</text>
  <text class="t2" x="812" y="302">API</text>
  <rect class="box" x="788" y="356" width="152" height="84" rx="10"/>
  <text class="t1" x="802" y="384">云端模型</text>
  <text class="t2" x="802" y="406">DeepSeek 等</text>
  <text class="t2" x="802" y="424">经 New API 转发</text>

  <!-- 连线 -->
  <path class="ln" d="M236 156 H318"/><text class="lb" x="262" y="148">MCP</text>
  <path class="ln" d="M236 280 H290 V160 H318"/>
  <path class="ln" d="M236 548 H268 V257 H318"/><text class="lb" x="254" y="540">HTTP</text>
  <path class="ln" d="M722 147 H800"/><text class="lb" x="742" y="139">派发</text>
  <path class="ln" d="M722 363 H760 V398 H788"/><text class="lb" x="738" y="355">转发</text>
  <path class="ln" d="M236 440 H300 V148"/>
</svg>
