<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="608" viewBox="0 0 1000 608"><rect width="1000" height="608" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><text x="40" y="28" text-anchor="start" dominant-baseline="middle" font-size="15" font-weight="700" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">步骤</text><text x="120" y="28" text-anchor="start" dominant-baseline="middle" font-size="15" font-weight="700" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">做什么</text><text x="420" y="28" text-anchor="start" dominant-baseline="middle" font-size="15" font-weight="700" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">工作台与中枢怎么联动</text><rect x="20" y="56" width="960" height="66" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/><text x="52" y="89" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#10B981" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">①</text><text x="96" y="89" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">员工说「打开小红书工作台」</text><text x="420" y="79.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">中枢按岗位包校验并记审计，本机下载、校验 SHA-256</text><text x="420" y="98.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"> 后启动</text><rect x="912" y="66" width="52" height="22" rx="11" fill="#10B981"/><text x="938" y="77" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">员工</text><rect x="20" y="132" width="960" height="66" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/><text x="52" y="165" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#F59E0B" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">②</text><text x="96" y="165" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">对标：只读采集博主和爆款</text><text x="420" y="155.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">在员工自己的浏览器里完成；总开关默认关，有每日上限、间隔</text><text x="420" y="174.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">与冷静期</text><rect x="912" y="142" width="52" height="22" rx="11" fill="#F59E0B"/><text x="938" y="153" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">工作台</text><rect x="20" y="208" width="960" height="66" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/><text x="52" y="241" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#6366F1" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">③</text><text x="96" y="241" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">开始写选题 / 文案</text><text x="420" y="231.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">工作台通过 MCP 读公司技能（选题、写作、合规）并检索</text><text x="420" y="250.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">知识库（产品卖点、品牌调性、违禁词）</text><rect x="912" y="218" width="52" height="22" rx="11" fill="#6366F1"/><text x="938" y="229" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">联动</text><rect x="20" y="284" width="960" height="66" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/><text x="52" y="317" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#6366F1" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">④</text><text x="96" y="317" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">AI 助手生成内容</text><text x="420" y="317" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">模型调用走中枢网关：按人计量、受岗位包额度限制</text><rect x="912" y="294" width="52" height="22" rx="11" fill="#6366F1"/><text x="938" y="305" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">联动</text><rect x="20" y="360" width="960" height="66" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/><text x="52" y="393" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#6366F1" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">⑤</text><text x="96" y="393" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">封面 / 视频</text><text x="420" y="383.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">提交到中枢的出图出视频队列，本机 GPU、第三方 API</text><text x="420" y="402.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"> 或 H3 网关任一通道完成</text><rect x="912" y="370" width="52" height="22" rx="11" fill="#6366F1"/><text x="938" y="381" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">联动</text><rect x="20" y="436" width="960" height="66" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/><text x="52" y="469" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#10B981" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">⑥</text><text x="96" y="469" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">人工确认并自己发布</text><text x="420" y="469" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">红线：工作台不会自动发布；员工确认内容后自己发</text><rect x="912" y="446" width="52" height="22" rx="11" fill="#10B981"/><text x="938" y="457" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">员工</text><rect x="20" y="512" width="960" height="66" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/><text x="52" y="545" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="700" fill="#6366F1" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">⑦</text><text x="96" y="545" text-anchor="start" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1F2937" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">成果与问题回到中枢</text><text x="420" y="535.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">成果上报进老板看板；报错自动回传到应用健康；AI 助手发</text><text x="420" y="554.5" text-anchor="start" dominant-baseline="middle" font-size="15"  fill="#374151" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">现技能或知识有误只能提「改进建议」，由主管审核后才生效</text><rect x="912" y="522" width="52" height="22" rx="11" fill="#6366F1"/><text x="938" y="533" text-anchor="middle" dominant-baseline="middle" font-size="14"  fill="#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">联动</text></svg>
