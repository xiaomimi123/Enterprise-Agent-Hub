# 中枢全部服务：
#   开源组件：Casdoor（身份）、New API（模型网关）、PostgreSQL、Redis
#   自研服务：console-web（控制台前端）、console-api（控制台后端）、hub-mcp（中枢 MCP Server）
# RAGFlow 依赖较多（ES、MySQL、MinIO 等），用官方 compose 单独部署，见 ragflow/setup.sh
#
# 用法：make env → 编辑 .env → make up → make bootstrap（首次）

name: hub

# 控制台后端与 MCP Server 共用一个镜像和同一组配置
x-hub-backend: &hub-backend
  build: ../console/backend
  image: hub-backend:${HUB_VERSION:-dev}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    casdoor:
      condition: service_started
  volumes:
    # 技能仓库与知识库（Obsidian vault）在宿主机上维护，容器只读挂载
    - ../skills:/data/skills:ro
    - ../vault:/data/vault:ro
  environment:
    HUB_CONSOLE_MODE: casdoor
    TZ: ${TZ}
    CASDOOR_ENDPOINT: http://casdoor:8000
    CASDOOR_PUBLIC_URL: ${CASDOOR_ORIGIN}
    CASDOOR_ORG: ${HUB_ORG}
    CASDOOR_APP: hub-console
    CASDOOR_CLIENT_ID: ${CASDOOR_CONSOLE_CLIENT_ID:-}
    CASDOOR_CLIENT_SECRET: ${CASDOOR_CONSOLE_CLIENT_SECRET:-}
    CONSOLE_PUBLIC_URL: http://${HUB_HOST}:${CONSOLE_PORT}
    HUB_CONSOLE_CORS: http://${HUB_HOST}:${CONSOLE_PORT}
    HUB_DATABASE_URL: postgresql://hub:${HUB_DB_PASSWORD}@postgres:5432/hub
    HUB_MCP_PUBLIC_URL: http://${HUB_HOST}:${MCP_PORT}/mcp
    HUB_AGENT_CLIENT_IDS: ${HUB_AGENT_CLIENT_ID:-}
    HUB_AGENT_CLIENT_SECRET: ${HUB_AGENT_CLIENT_SECRET:-}
    HUB_AGENT_PASSWORD_LOGIN: ${HUB_AGENT_PASSWORD_LOGIN:-false}
    HUB_EXTERNAL_CLIENT_IDS: ${HUB_EXTERNAL_CLIENT_ID:-}
    NEWAPI_ENDPOINT: http://new-api:3000
    NEWAPI_PUBLIC_URL: http://${HUB_HOST}:${NEWAPI_PORT}
    NEWAPI_ACCESS_TOKEN: ${NEWAPI_ACCESS_TOKEN:-}
    NEWAPI_ADMIN_ID: ${NEWAPI_ADMIN_ID:-}
    HUB_DEFAULT_MODEL: ${HUB_DEFAULT_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?}
      NEWAPI_DB_PASSWORD: ${NEWAPI_DB_PASSWORD:?}
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD:?}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./postgres/ensure-hub-db.sh:/ensure-hub-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 只映射到本机回环地址：开发时在宿主机上直接运行后端用；容器内服务走 postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 不映射到宿主机端口，避免和 RAGFlow 自带的 Redis（6379）冲突

  casdoor:
    image: casbin/casdoor:${CASDOOR_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CASDOOR_PORT}:8000"
    environment:
      # app.conf 的每一项都可以用同名环境变量覆盖
      runmode: prod
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD} host=postgres port=5432 sslmode=disable dbname=casdoor"
      dbName: casdoor
      origin: ${CASDOOR_ORIGIN}
      defaultLanguage: zh
      # 仅在首次初始化数据库时生效：built-in/admin 的初始密码
      initAdminPassword: ${CASDOOR_ADMIN_PASSWORD:?}
      TZ: ${TZ}

  new-api:
    image: calciumion/new-api:${NEWAPI_VERSION}
    restart: unless-stopped
    command: --log-dir /app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${NEWAPI_PORT}:3000"
    environment:
      SQL_DSN: "postgresql://newapi:${NEWAPI_DB_PASSWORD}@postgres:5432/newapi"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:?}
      ERROR_LOG_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  console-api:
    <<: *hub-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 不对外暴露，由 console-web 转发 /api

  hub-mcp:
    <<: *hub-backend
    command: ["uvicorn", "app.mcp_server:app", "--host", "0.0.0.0", "--port", "8200", "--proxy-headers"]
    depends_on:
      # 等控制台后端建好表再启动，避免两个服务同时建表
      console-api:
        condition: service_healthy
    ports:
      - "${MCP_PORT}:8200"

  # 开发/演示用的模拟大模型，仅在 demo profile 下启动（make bootstrap-demo 会开启）
  mock-llm:
    image: hub-backend:${HUB_VERSION:-dev}
    build: ../console/backend
    profiles: ["demo"]
    restart: unless-stopped
    command: ["uvicorn", "app.mock_llm:app", "--host", "0.0.0.0", "--port", "8300"]

  console-web:
    build: ../console/frontend
    image: hub-console-web:${HUB_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      console-api:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT}:80"
