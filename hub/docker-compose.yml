# 中枢核心服务：Casdoor（身份）+ New API（模型网关）+ 共用的 PostgreSQL / Redis
# RAGFlow 依赖较多（ES、MySQL、MinIO 等），用官方 compose 单独部署，见 ragflow/setup.sh
#
# 用法：cp .env.example .env（或 make env）→ make up

name: hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?}
      NEWAPI_DB_PASSWORD: ${NEWAPI_DB_PASSWORD:?}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 不映射到宿主机端口，只在 hub 网络内访问

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 不映射到宿主机端口，避免和 RAGFlow 自带的 Redis（6379）冲突

  casdoor:
    image: casbin/casdoor:${CASDOOR_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CASDOOR_PORT}:8000"
    environment:
      # app.conf 的每一项都可以用同名环境变量覆盖
      runmode: prod
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD} host=postgres port=5432 sslmode=disable dbname=casdoor"
      dbName: casdoor
      origin: ${CASDOOR_ORIGIN}
      defaultLanguage: zh
      # 仅在首次初始化数据库时生效：built-in/admin 的初始密码
      initAdminPassword: ${CASDOOR_ADMIN_PASSWORD:?}
      TZ: ${TZ}

  new-api:
    image: calciumion/new-api:${NEWAPI_VERSION}
    restart: unless-stopped
    command: --log-dir /app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${NEWAPI_PORT}:3000"
    environment:
      SQL_DSN: "postgresql://newapi:${NEWAPI_DB_PASSWORD}@postgres:5432/newapi"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:?}
      ERROR_LOG_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
